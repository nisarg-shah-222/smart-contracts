# File: .github/workflows/pr-review.yml

name: Smart Contract PR Reviewer

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.sol'

permissions:
  contents: read
  pull-requests: write

jobs:
  review_pr:
    runs-on: ubuntu-latest

    env:
      BACKEND_URL: ${{ secrets.BACKEND_URL }}

    steps:
      # Step 1: Check out the code, fetching the entire history to allow diffing against main
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important for fetching history to diff against the base branch

      # Step 2: Set up the Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Generate a diff file to be included in the payload
      - name: Generate diff file
        run: |
          echo "📝 Generating diff against origin/main..."
          # Fetch the main branch to ensure the base of the diff is up-to-date
          git fetch origin main
          git diff origin/main...HEAD > diff.patch
          echo "✅ Diff generated:"
          cat diff.patch

      # Step 4: Prepare the payload with 'before' and 'after' code states
      - name: Prepare payload with before and after states
        id: prepare_payload
        run: |
          python - <<EOF
          import subprocess
          import json
          import os

          # Get the list of changed Solidity files
          print("📂 Collecting changed Solidity files...")
          changed_files_str = subprocess.check_output(
              "git diff --name-only origin/main...HEAD -- '*.sol'",
              shell=True,
              text=True
          ).strip()

          # If no .sol files were changed, exit gracefully
          if not changed_files_str:
              print("No Solidity files changed. Skipping review.")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write("has_changes=false\n")
              exit(0)

          changed_files = changed_files_str.splitlines()
          print(f"🔍 Files changed: {changed_files}")

          codebase_before = {}
          codebase_after = {}

          for file_path in changed_files:
              # Get the state of the file AFTER changes from the local checkout
              print(f"📄 Reading 'after' state for {file_path}")
              if os.path.exists(file_path):
                  with open(file_path, 'r') as f:
                      codebase_after[file_path] = f.read()
              else:
                  # The file was deleted in the PR
                  codebase_after[file_path] = ""

              # Get the state of the file BEFORE changes from the main branch
              print(f"📄 Reading 'before' state for {file_path}")
              try:
                  # Use git show to get the file content from the base branch
                  before_content = subprocess.check_output(
                      f"git show origin/main:{file_path}",
                      shell=True,
                      text=True,
                      stderr=subprocess.DEVNULL # Hide errors for new files
                  )
                  codebase_before[file_path] = before_content
              except subprocess.CalledProcessError:
                  # This error means the file is new, so its 'before' state is empty
                  print(f"'{file_path}' is a new file. 'Before' state is empty.")
                  codebase_before[file_path] = ""

          # Read the diff content from the file generated in the previous step
          with open("diff.patch", "r") as f:
              diff_content = f.read()

          # Assemble the final payload with the new structure
          payload = {
              "diff": diff_content,
              "codebase_before": codebase_before,
              "codebase_after": codebase_after
          }

          # Write the payload to a file for the next step
          with open("payload.json", "w") as f:
              json.dump(payload, f, indent=2)

          print("✅ Payload prepared with 'before' and 'after' states:")
          print(json.dumps(payload, indent=2))
          
          # Set a step output to indicate that changes were found and processed
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write("has_changes=true\n")
          EOF

      # Step 5: Call the backend API, but only if there were Solidity changes
      - name: Call backend API
        id: call_backend
        if: steps.prepare_payload.outputs.has_changes == 'true'
        run: |
          echo "📡 Sending payload to backend API at $BACKEND_URL..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$BACKEND_URL/analyze" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json)
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "✅ Response received from backend (HTTP Status: $HTTP_CODE):"
          echo "$BODY" | jq '.'

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Backend API returned status $HTTP_CODE"
            exit 1
          fi

          REVIEW_COMMENT=$(echo "$BODY" | jq -r '.review_comment')

          echo "review_comment<<EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW_COMMENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Step 6: Post the review comment on the PR, but only if a review was generated
      - name: Comment on PR
        if: steps.prepare_payload.outputs.has_changes == 'true'
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## 🤖 Automated Smart Contract PR Review
            
            ${{ steps.call_backend.outputs.review_comment }}

      # Step 7: Final confirmation message
      - name: Finish workflow
        run: |
          echo "🎉 Workflow completed successfully."
